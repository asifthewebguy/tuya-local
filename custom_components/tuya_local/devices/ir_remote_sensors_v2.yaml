name: Universal remote control
products:
  - id: aylugcbglvu577sw
entities:
  - entity: remote
    dps:
      - id: 201
        name: send
        type: string
        optional: true
      - id: 202
        name: receive
        type: string
        optional: true
        persist: false
  - entity: infrared
    dps:
      - id: 201
        name: send
        type: string
        optional: true
  - entity: sensor
    class: temperature
    dps:
      - id: 1
        name: sensor
        type: integer
        class: measurement
        unit: C
        mapping:
          - scale: 10
  - entity: sensor
    class: humidity
    dps:
      - id: 2
        name: sensor
        type: integer
        unit: "%"
        class: measurement
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 5
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: binary_sensor
    class: battery_charging
    category: diagnostic
    dps:
      - id: 8
        name: sensor
        type: boolean
        optional: true
  - entity: binary_sensor
    class: plug
    category: diagnostic
    dps:
      - id: 20
        name: sensor
        type: string
        optional: true
        mapping:
          - dps_val: usb_power
            value: true
          - value: false
